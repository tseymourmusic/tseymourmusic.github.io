<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4iAI | Tim Seymour Composer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="/player.css">
    <link rel="stylesheet" href="/menu.css">

    <style>
        body, html { 
            margin: 0; padding: 0; 
            background-color: #0a0a0a; 
            color: #FFFFFF; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
        }
        
        .container { max-width: 1000px; margin: 100px auto 60px; padding: 0 20px; }
        
        h1 { 
            text-align: center; font-size: 2.8rem; 
            letter-spacing: 12px; padding-left: 12px;
            margin-bottom: 15px; font-weight: 100; text-transform: uppercase;
        }

        .tagline { 
            text-align: center; font-style: italic; color: #eae0d5; 
            font-size: 0.85rem; margin-bottom: 60px; font-weight: 300;
            letter-spacing: 1px; text-shadow: 0 0 12px rgba(234, 224, 213, 0.5);
        }

        /* Standardised Audio Container (Matches Tales For All Time) */
        .audio-container {
            width: 100%;
            margin: 0 auto;
            display: block; 
            text-align: center;
        }

        /* Standardised Player Scaling Overrides */
        #player-placeholder .player-container {
            margin: 0 auto 80px auto !important;
            max-width: 700px !important; /* Maintains the 'Pill' shape on desktop */
            display: flex; 
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100% !important;
        }

        /* Ensures the progress bar stretches correctly within the pill */
        #player-placeholder .console {
            flex: 1 !important; 
        }

        /* Playlist Styling */
        #playlist-target { margin-top: 30px; }

        #playlist {
            display: block !important; 
            list-style: none;
            padding: 0;
            margin-top: 40px;
            border-top: 1px solid #333;
        }

        .track {
            padding: 25px 15px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 200;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .track:hover {
            background: rgba(234, 224, 213, 0.05);
            padding-left: 25px;
            color: #eae0d5;
        }

        .track.active {
            color: #eae0d5;
            background: rgba(234, 224, 213, 0.03);
            border-left: 2px solid #eae0d5;
        }

        .track::before {
            content: "\f04b";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            margin-right: 20px;
            font-size: 0.7rem;
            opacity: 0.3;
        }

        #footer-placeholder { margin-top: 80px; padding-bottom: 40px; }

        @media (max-width: 800px) { 
            .container { margin-top: 150px; padding: 0 15px; } 
            h1 { font-size: 1.8rem; letter-spacing: 6px; padding-left: 6px; }
            #player-placeholder .player-container { gap: 10px; }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container">
        <h1>4<span class="lowercase-letter">i</span>AI</h1>
        <p class="tagline">Maintaining Artistic Integrity Through Human-AI Collaboration</p>

         <!-- PDF Embedded Viewer -->
        <iframe src="/pdfs/4iai_tim-seymour.pdf" width="100%" height="800px" style="border: none;">
        <p>This browser does not support PDFs. Please download the PDF to view it: 
        <a href="/pdfs/4iai_tim-seymour.pdf">Download PDF</a>.</p>
        </iframe>
        </div>

    <div id="footer-placeholder"></div>

    <script src="/player.js"></script>
    
    <script>
    </script>
</body>
</html>
